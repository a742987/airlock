[workspace]
resolver = "2"
members = [
    "crates/airlock-core",
    "crates/airlockd",
    "crates/airlock-cli",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/airlock-dev/airlock"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
# F13 凭据作用域代理：Vault 动态密钥的阻塞式 HTTP 客户端（全仓无 async 约束）
ureq = { version = "2", default-features = false, features = ["tls"] }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"

[profile.release]
lto = "thin"
strip = true
