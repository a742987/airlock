name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# 第三方 action 固定到不可变 commit SHA，避免 tag 被劫持时 CI 静默执行恶意代码。
# 网络受限时未能在线核验的 SHA 保持 tag 并标注 TODO，后续补齐。
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # dtolnay/rust-toolchain 按 "stable/1.80.0" 解析到同名移动分支，按版本固定
      # 会把工具链永久冻结在某个时点，故此 action 保留分支引用、不做 SHA pin。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # TODO: 离线环境无法核验 v2 最新 SHA，后续替换为 rust-cache v2.x 的 commit SHA
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --check

  msrv:
    # 强制 README 声明的 "Rust 1.80+"（workspace rust-version = 1.80）真实可编译
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@1.80.0
      # TODO: 离线环境无法核验 v2 最新 SHA，后续替换为 rust-cache v2.x 的 commit SHA
      - uses: Swatinem/rust-cache@v2
      - name: MSRV 1.80 编译检查
        run: cargo check --workspace --all-targets --locked

  test-linux:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        # 内核矩阵：≥5.13 支持 Landlock（L2 真实拦截可测）；L1 全平台兜底（§7 风险表降级链）
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
      # TODO: 离线环境无法核验 v2 最新 SHA，后续替换为 rust-cache v2.x 的 commit SHA
      - uses: Swatinem/rust-cache@v2
      - name: 单元 + 集成测试（含 1000 并发混沌、L2 Landlock 真实拦截）
        run: cargo test --workspace --locked
      - name: 性能预算门禁（release：claim p50<5ms / p99<50ms，§8.1）
        run: cargo test --release --locked -p airlockd --test integration perf_claim_latency_budget

  test-macos:
    # macOS：仅 L1 advisory（兼容矩阵 §8.2）；doctor 报告不可用原因且退出码 0（AC2.3）
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
      # TODO: 离线环境无法核验 v2 最新 SHA，后续替换为 rust-cache v2.x 的 commit SHA
      - uses: Swatinem/rust-cache@v2
      - name: macOS（L1）全量测试——Landlock 用例自动跳过（内核门控）
        run: cargo test --workspace --locked

  test-windows-wsl:
    # v0.1 的 Windows 支持形态 = WSL2（等效 Linux 矩阵，§8.2）；原生 L2W 自 v2.5 起
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # TODO: 离线环境无法核验 v3 最新 SHA，后续替换为 setup-wsl v3.x 的 commit SHA
      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04
      # 注：rust-cache 运行在 Windows 侧，仅能覆盖检出目录（DrvFS）中的 target/；
      # WSL 内部的 CARGO_HOME（注册表索引）不在其缓存范围，聊胜于无。
      # TODO: 离线环境无法核验 v2 最新 SHA，后续替换为 rust-cache v2.x 的 commit SHA
      - uses: Swatinem/rust-cache@v2
      - name: WSL2 内安装 Rust 并测试
        shell: wsl-bash {0}
        run: |
          # rustup --profile minimal 不含链接器；bundled SQLite / tree-sitter 的 C
          # 编译需要 cc（缺失时 `linker 'cc' not found`，CI 自首日起失败的原因）
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source "$HOME/.cargo/env"
          # 测试临时仓库（SQLite WAL + fcntl 锁）必须落在 WSL 原生文件系统：
          # DrvFS/9P 上的 fcntl 锁不可靠（FileLockingProtocolFailed）。
          # /var/tmp 为 ext4 原生盘，且路径短（兼容 macOS SUN_LEN 语义的测试假设）。
          export TMPDIR=/var/tmp/airlock-ci
          mkdir -p "$TMPDIR"
          cargo test --workspace --locked
